# Cloud Build pipeline: build → push → deploy
# Triggered by push to master (configured in Cloud Build trigger).
#
# Substitutions Cloud Build inyecta automáticamente:
#   $PROJECT_ID  → project-f9adc6cd-78f9-462a-8a6
#   $COMMIT_SHA  → hash del commit
#
# Substitutions custom (definidas aquí, override en el trigger si se necesita):
#   _REGION         → us-central1
#   _AR_REPO        → medsync                (Artifact Registry repo)
#   _SERVICE        → medsync-backend        (Cloud Run service)
#   _SQL_INSTANCE   → project-f9adc6cd-78f9-462a-8a6:us-central1:medsync-db
#   _RUNTIME_SA     → medsync-runtime@$PROJECT_ID.iam.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _AR_REPO: medsync
  _SERVICE: medsync-backend
  _SQL_INSTANCE: project-f9adc6cd-78f9-462a-8a6:us-central1:medsync-db
  _RUNTIME_SA: medsync-runtime@project-f9adc6cd-78f9-462a-8a6.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Build Docker image (con cache de la imagen `latest` para builds más rápidos)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  # 2. Push image (ambos tags)
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  # 3. Deploy a Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=QUARKUS_PROFILE=prod,INSTANCE_CONNECTION_NAME=${_SQL_INSTANCE}
      - --set-secrets=DB_PASSWORD=medsync-db-password:latest,HOSPITAL_DB_PASSWORD=hospital-db-password:latest,CORS_ORIGINS=cors-origins:latest,/secrets/firebase-adminsdk.json=firebase-adminsdk:latest
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --port=8080
      - --timeout=300

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

timeout: 1200s
