quarkus.application.name=medsync-backend
quarkus.http.port=8080

# Use a random free port for @QuarkusTest runs so multiple JVMs / a live
# quarkus:dev session do not collide on the default 8081.
%test.quarkus.http.test-port=0

# =============================================
# CORS (frontend Vite en :5173)
# =============================================
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=24H

# Dev: origenes locales del frontend (Vite + Storybook)
%dev.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:6006,https://medsync-frontend-320491891506.us-central1.run.app

# Test
%test.quarkus.http.cors.origins=http://localhost:5173

# mysql-local (docker compose): mismos origenes que dev
%mysql-local.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:6006

# cloudsql (probar Cloud SQL desde laptop): mismos origenes que dev
%cloudsql.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:6006

# Prod: configurable via variable de entorno (lista separada por coma)
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}

# =============================================
# SEGURIDAD / FIREBASE (Añadido para MedSync)
# =============================================
# Asegúrate de que el archivo JSON esté en src/main/resources/
firebase.config.path=src/main/resources/medsync-firebase-adminsdk.json
# En tests no exigimos token real: se usa @InjectMock AuthenticatedUserContext.
%test.medsync.security.firebase-filter.enabled=false

# =============================================
# PERSISTENCIA: Unidad <default> (MedSync DB)
# =============================================
quarkus.hibernate-orm.packages=itesm.medsync.infrastructure.persistence
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Flyway: Manejo de migraciones
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
# Migraciones vendor-agnósticas viven en src/main/resources/db/migration.
# Migraciones específicas por motor viven en db/vendor_{vendor}/ (mysql / h2),
# que no comparten prefijo con db/migration — Flyway descarta sub-locations
# que solapan con su padre, así que el path vendor debe ser hermano, no hijo.
# El placeholder {vendor} es resuelto por Quarkus al kind del datasource activo.
quarkus.flyway.locations=db/migration,db/vendor_{vendor}

# =============================================
# PERSISTENCIA: Unidad "hospital" (Sistema Externo)
# =============================================
quarkus.hibernate-orm."hospital".packages=itesm.medsync.infrastructure.hospital
quarkus.hibernate-orm."hospital".datasource=hospital

# Documentación API
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
# Swagger UI sólo se publica en dev/test/local; en prod queda deshabilitado (no se incluye en el build)
%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true
%mysql-local.quarkus.swagger-ui.always-include=true
%cloudsql.quarkus.swagger-ui.always-include=true

# -------- Profile: dev (H2 en memoria) --------
# Este es el que usas por defecto al ejecutar ./mvnw quarkus:dev
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:medsync;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%dev.quarkus.hibernate-orm.log.sql=true

%dev.quarkus.datasource."hospital".db-kind=h2
%dev.quarkus.datasource."hospital".jdbc.url=jdbc:h2:mem:hospital;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource."hospital".username=sa
%dev.quarkus.datasource."hospital".password=
%dev.quarkus.hibernate-orm."hospital".dialect=org.hibernate.dialect.H2Dialect
%dev.quarkus.hibernate-orm."hospital".database.generation=drop-and-create

# -------- Profile: test (H2 en memoria para pruebas unitarias) --------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:medsync-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.flyway.clean-at-start=true

%test.quarkus.datasource."hospital".db-kind=h2
%test.quarkus.datasource."hospital".jdbc.url=jdbc:h2:mem:hospital-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource."hospital".username=sa
%test.quarkus.datasource."hospital".password=
%test.quarkus.hibernate-orm."hospital".dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.hibernate-orm."hospital".database.generation=drop-and-create

# -------- Profile: mysql-local (MySQL en Docker) --------
# Para usar este perfil: ./mvnw quarkus:dev -Dquarkus.profile=mysql-local
%mysql-local.quarkus.datasource.db-kind=mysql
%mysql-local.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/medsync
%mysql-local.quarkus.datasource.username=medsync
%mysql-local.quarkus.datasource.password=medsync
%mysql-local.quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
%mysql-local.quarkus.hibernate-orm.log.sql=true

%mysql-local.quarkus.datasource."hospital".db-kind=mysql
%mysql-local.quarkus.datasource."hospital".jdbc.url=jdbc:mysql://localhost:3308/hospital
%mysql-local.quarkus.datasource."hospital".username=hospital
%mysql-local.quarkus.datasource."hospital".password=hospital
%mysql-local.quarkus.hibernate-orm."hospital".dialect=org.hibernate.dialect.MySQLDialect
%mysql-local.quarkus.hibernate-orm."hospital".database.generation=validate

# -------- Profile: cloudsql (probar Cloud SQL desde laptop via Auth Proxy) --------
# Uso: ./mvnw quarkus:dev -Dquarkus.profile=cloudsql
# Requiere: cloud-sql-proxy corriendo en localhost:3309
%cloudsql.quarkus.datasource.db-kind=mysql
%cloudsql.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3309/medsync
%cloudsql.quarkus.datasource.username=medsync_user
%cloudsql.quarkus.datasource.password=${MEDSYNC_DB_PASSWORD}
%cloudsql.quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
%cloudsql.quarkus.hibernate-orm.log.sql=true

%cloudsql.quarkus.datasource."hospital".db-kind=mysql
%cloudsql.quarkus.datasource."hospital".jdbc.url=jdbc:mysql://localhost:3309/hospital
%cloudsql.quarkus.datasource."hospital".username=hospital_user
%cloudsql.quarkus.datasource."hospital".password=${HOSPITAL_DB_PASSWORD}
%cloudsql.quarkus.hibernate-orm."hospital".dialect=org.hibernate.dialect.MySQLDialect
%cloudsql.quarkus.hibernate-orm."hospital".database.generation=validate

# -------- Profile: prod (Cloud Run + Cloud SQL via Socket Factory) --------
# Variables de entorno inyectadas por Cloud Run:
#   INSTANCE_CONNECTION_NAME = project:region:instance (no secreto, env var normal)
#   DB_PASSWORD              = de Secret Manager (medsync-db-password)
#   HOSPITAL_DB_PASSWORD     = de Secret Manager (hospital-db-password)
#   CORS_ORIGINS             = de Secret Manager (cors-origins)
# Volumen montado:
#   /secrets/firebase-adminsdk.json (de Secret Manager firebase-adminsdk)

%prod.quarkus.datasource.db-kind=mysql
%prod.quarkus.datasource.jdbc.url=jdbc:mysql:///medsync?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory
%prod.quarkus.datasource.username=medsync_user
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect

%prod.quarkus.datasource."hospital".db-kind=mysql
%prod.quarkus.datasource."hospital".jdbc.url=jdbc:mysql:///hospital?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory
%prod.quarkus.datasource."hospital".username=hospital_user
%prod.quarkus.datasource."hospital".password=${HOSPITAL_DB_PASSWORD}
%prod.quarkus.hibernate-orm."hospital".dialect=org.hibernate.dialect.MySQLDialect
%prod.quarkus.hibernate-orm."hospital".database.generation=validate

%prod.firebase.config.path=/secrets/firebase-adminsdk.json

# =============================================
# PUBMED E-UTILITIES (NCBI)
# =============================================
# URL base del cliente REST MicroProfile para llamar a E-utilities de NCBI.
# El acceso es público (sin API key); para mayor rate-limit añadir:
#   &api_key=${NCBI_API_KEY}
quarkus.rest-client."pubmed-eutils".url=https://eutils.ncbi.nlm.nih.gov/entrez/eutils
quarkus.rest-client."pubmed-eutils".read-timeout=30000
quarkus.rest-client."pubmed-eutils".connect-timeout=10000

# Scheduler de sincronización PubMed (diario a las 12:00)
# Expresión cron: segundo minuto hora día-mes mes día-semana
# 0 0 12 * * ? => todos los días a las 12:00:00
quarkus.scheduler.cron.pubmed-sync-job=0 0 12 * * ?

# En test deshabilitamos el scheduler para no disparar llamadas reales a PubMed
%test.quarkus.scheduler.enabled=false

# =============================================
# MEDICAL VOCABULARY
# =============================================
# Asegura que los archivos JSON de vocabulary/ se incluyan al construir un native image.
quarkus.native.resources.includes=vocabulary/*.json